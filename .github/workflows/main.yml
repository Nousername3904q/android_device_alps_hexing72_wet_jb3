name: Compile TWRP Recovery Image
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Freeing Up Server Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/apt/sources.list.d/* /usr/local/lib/android
        sudo apt-get clean

    - name: Set Up Building Packages
      run: |
        sudo apt-get update
        # Replaced Python 3 with Python 2 to prevent build script crashes
        sudo apt-get install -y bc bison build-essential curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python2 cpio
        # Force python command to use python2
        sudo ln -sf /usr/bin/python2 /usr/bin/python

    - name: Install Legacy Compatibility Libraries
      run: |
        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.2-0ubuntu2_amd64.deb
        wget -q http://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.2-0ubuntu2_amd64.deb
        sudo dpkg -i libtinfo5_6.2-0ubuntu2_amd64.deb libncurses5_6.2-0ubuntu2_amd64.deb
        rm libtinfo5_6.2-0ubuntu2_amd64.deb libncurses5_6.2-0ubuntu2_amd64.deb

    - name: Fetch and Configure Stable Repo Launcher
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o ~/bin/repo
        chmod a+x ~/bin/repo
        sudo cp ~/bin/repo /usr/local/bin/repo

    - name: Initialize TWRP Workspace & Sync
      run: |
        mkdir -p ~/workspace && cd ~/workspace
        git config --global user.email "git@github.com"
        git config --global user.name "GitHub Action"
        /usr/local/bin/repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-4.4-deprecated
        /usr/local/bin/repo sync -c -j$(nproc) --no-tags --no-clone-bundle
        echo "=== DIAGNOSTIC: checked out manifest branch ==="
        cat ~/workspace/.repo/manifest.xml | grep -i "revision=" | head -5
        echo "=== DIAGNOSTIC: build/core/build_id.mk (Android version marker) ==="
        cat ~/workspace/build/core/build_id.mk 2>/dev/null || echo "not found"

    - name: Clone Local Device Tree
      run: |
        cd ~/workspace
        git clone https://github.com/Nousername3904q/android_device_alps_hexing72_wet_jb3.git device/alps/hexing72_wet_jb3

    - name: Compile TWRP Image
      run: |
        cd ~/workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        . build/envsetup.sh
        lunch twrp_hexing72_wet_jb3-eng
        make recoveryimage -j$(nproc)

    - name: Upload Completed TWRP File
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-hexing72_wet_jb3-Recovery
        path: /home/runner/workspace/out/target/product/hexing72_wet_jb3/*.img
