name: Compile TWRP Recovery Image
on:
  workflow_dispatch:

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git
  MANIFEST_BRANCH: twrp-5.1
  DEVICE_TREE_URL: https://github.com/Nousername3904q/android_device_alps_hexing72_wet_jb3.git
  DEVICE_PATH: device/alps/hexing72_wet_jb3
  DEVICE_CODENAME: hexing72_wet_jb3
  MAKE_TARGET: recoveryimage

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:16.04

    steps:
    - name: Set Up Building Packages & Legacy Dependencies
      run: |
        apt-get update
        apt-get install -y bc bison build-essential ccache cpio curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python python3 openjdk-8-jdk wget

    - name: Install Repo Launcher
      run: |
        mkdir -p ~/bin
        curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
        chmod a+rx /usr/local/bin/repo

    - name: Initialize TWRP Workspace & Sync
      run: |
        mkdir -p ~/workspace && cd ~/workspace
        git config --global user.email "action@github.com"
        git config --global user.name "GitHub Action"
        
        repo init --depth=1 -u ${{ env.MANIFEST_URL }} -b ${{ env.MANIFEST_BRANCH }}
        repo sync -c -j4 --no-tags --no-clone-bundle --force-sync

    - name: Clone Device Tree
      run: |
        cd ~/workspace
        git clone ${{ env.DEVICE_TREE_URL }} ${{ env.DEVICE_PATH }}
        rm -rf ${{ env.DEVICE_PATH }}/vendorsetup.sh

    - name: Compile TWRP Image
      run: |
        cd ~/workspace
        export ALLOW_MISSING_DEPENDENCIES=true
        export LC_ALL=C
        export USE_CCACHE=1
        export CCACHE_EXEC=/usr/bin/ccache
        ccache -M 50G
        
        export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64
        export PATH=$JAVA_HOME/bin:$PATH
        
        source build/envsetup.sh
        lunch omni_${{ env.DEVICE_CODENAME }}-eng
        make ${{ env.MAKE_TARGET }} -j2

    - name: Upload Completed TWRP Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-${{ env.DEVICE_CODENAME }}-Recovery
        path: /root/workspace/out/target/product/${{ env.DEVICE_CODENAME }}/recovery.img
        if-no-files-found: error
